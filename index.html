<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>證照整理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2328;--mut:#6b7280;--bd:#e3e1d9;--ac:#1d6b5a;--acbg:#e3f1ed;--warn:#8a5a00;--warnbg:#fff1cc;--bad:#a32020;--badbg:#fde4e4;--ok:#1d6b5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--card:#212425;--tx:#ececea;--mut:#9aa0a6;--bd:#34383a;--ac:#5cc4ab;--acbg:#1f3a33;--warn:#f0c15a;--warnbg:#3b3017;--bad:#ff8a8a;--badbg:#401f1f;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%}
input.big{width:100%;box-sizing:border-box;font-size:17px;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--acbg);color:var(--ac);font-size:13px;margin:2px 4px 2px 0;cursor:pointer;border:0}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px}
.t-ok{background:var(--acbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}
.mut{color:var(--mut);font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);font-size:14px;white-space:nowrap}
th{color:var(--mut);font-weight:500}
.hide{display:none}
.stat{display:flex;gap:10px;flex-wrap:wrap}.stat div{flex:1;min-width:110px;text-align:center;padding:10px;border-radius:10px}
.stat b{display:block;font-size:24px}
.login{max-width:400px;margin:40px auto}
</style>
</head>
<body>
<main>
<div class="row" style="justify-content:space-between"><h1>證照整理</h1><div id="acct" class="mut"></div></div>
<div id="login"></div>
<div id="sync"></div>
<nav id="nav"></nav>
<div id="v"></div>
</main>
<script>
var KEY='certdata_v1',D={rows:[],alias:{},days:30},tab='search',q='',sel=null,pend=null;
function load(){try{var s=localStorage.getItem(KEY);if(s)D=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}if(cloud&&cloud.ready&&user)cloudSave()}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function iso(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function pd(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'){var t=new Date(Date.UTC(1899,11,30)+v*864e5);return iso(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())}
  var s=String(v).trim(),m=s.match(/(\d{2,4})\D+(\d{1,2})\D+(\d{1,2})/)||s.match(/^(\d{3})(\d{2})(\d{2})$/)||s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(!m)return '';var y=+m[1];if(y<1911)y+=1911;return iso(y,+m[2],+m[3]);
}
function std(r){return D.alias[r.cert]||r.cert}
function due(r){var e=r.exp||'',ru=D.rules[std(r)];if(isOn(ru)&&ru.years){var l='';D.train.forEach(function(t){if(t.name===r.name&&t.cert===std(r)&&t.date>l)l=t.date});if(l){var x=new Date(l+'T00:00:00');x.setFullYear(x.getFullYear()+ru.years);var s=iso(x.getFullYear(),x.getMonth()+1,x.getDate());if(s>e)e=s}}return e}
function days(r){var e=due(r);if(!e||r.cx||isLeft(r))return null;var a=new Date(e+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((a-n)/864e5)}
var pdp='',pshow=false,popen={},pq2='',plist=[];
function pkey(r){return r.emp||r.name}
function isLeft(r){return !!D.left[pkey(r)]}
function tg(i){var k=plist[i].k;popen[k]=!popen[k];render()}
function lv(i,c){var k=plist[i].k;if(c)D.left[k]=1;else delete D.left[k];save();render()}
function pqin(el){pq2=el.value;var p=el.selectionStart;render();var e=document.getElementById('pq');e.focus();e.setSelectionRange(p,p)}
function vPeople(){
  if(!D.rows.length)return '<div class="card">還沒有資料。</div>';
  var m={};D.rows.forEach(function(r){var k=pkey(r),p=m[k]||(m[k]={k:k,name:r.name,emp:r.emp||'',dept:r.dept||'未分部門',rows:[]});p.rows.push(r)});
  var all=Object.keys(m).map(function(k){return m[k]}),depts=Array.from(new Set(all.map(function(p){return p.dept}))).sort(),kw=pq2.trim().toLowerCase(),nl=all.filter(function(p){return D.left[p.k]}).length;
  plist=all.filter(function(p){return (pshow||!D.left[p.k])&&(!pdp||p.dept===pdp)&&(!kw||(p.name+p.emp).toLowerCase().indexOf(kw)>=0)}).sort(function(a,b){return a.dept.localeCompare(b.dept)||a.name.localeCompare(b.name)});
  var h='<div class="row"><select onchange="pdp=this.value;render()"><option value="">全部部門</option>'+depts.map(function(d){return '<option '+(d===pdp?'selected':'')+'>'+esc(d)+'</option>'}).join('')+'</select><input id="pq" placeholder="姓名或員編" value="'+esc(pq2)+'" oninput="pqin(this)"><label class="mut"><input type="checkbox" '+(pshow?'checked':'')+' onchange="pshow=this.checked;render()"> 顯示離職（'+nl+'）</label></div><div class="mut" style="margin-top:8px">在職 '+(all.length-nl)+' 人，點姓名展開證照。勾「離職」後不再提醒，也不會出現在查詢結果。</div>';
  var last='';
  plist.forEach(function(p,i){
    if(p.dept!==last){last=p.dept;h+='<div style="margin:14px 0 2px"><b>'+esc(p.dept)+'</b></div>'}
    var e=0,s=0,ms=0;p.rows.forEach(function(r){var d=days(r);if(d!==null&&d<0)e++;else if(d!==null&&d<=D.days)s++;if(missing(r).length)ms++});
    var st=D.left[p.k]?'<span class="tag">離職</span>':(e||s||ms)?(e?'<span class="tag t-bad">過期 '+e+'</span> ':'')+(s?'<span class="tag t-warn">快到期 '+s+'</span> ':'')+(ms?'<span class="tag t-warn">資料不齊 '+ms+'</span>':''):'<span class="tag t-ok">正常</span>';
    h+='<div class="card" style="margin:6px 0"><div class="row" style="justify-content:space-between"><div style="cursor:pointer" onclick="tg('+i+')">'+(popen[p.k]?'▾ ':'▸ ')+'<b>'+esc(p.name)+'</b> <span class="mut">'+esc(p.emp)+'・'+p.rows.length+' 張</span> '+st+'</div><label class="mut"><input type="checkbox" '+(D.left[p.k]?'checked':'')+' onchange="lv('+i+',this.checked)"> 離職</label></div>';
    if(popen[p.k])h+='<div class="scroll"><table><tr><th>證照</th><th>到期日</th><th>狀態</th><th>紙本位置</th><th></th></tr>'+p.rows.map(function(r){return '<tr><td>'+esc(std(r))+'</td><td>'+esc(due(r)||'-')+'</td><td>'+badge(r)+'</td><td>'+esc(r.loc||'-')+'</td><td><button class="btn" onclick="editRow('+D.rows.indexOf(r)+')">編輯</button></td></tr>'}).join('')+'</table></div>';
    h+='</div>'});
  return h}
var xsel={},xq='',xleft=false,lastHit=[];
function xcerts(){return certList().filter(function(c){return !xq||c.toLowerCase().indexOf(xq.toLowerCase())>=0})}
function xrows(){return D.rows.filter(function(r){return xsel[std(r)]&&(xleft||!isLeft(r))})}
function xcount(){var b=document.getElementById('xbtn');if(b)b.textContent='匯出選取的證照（'+xrows().length+' 筆）'}
function xtog(i,c){var n=xcerts()[i];if(c)xsel[n]=1;else delete xsel[n];xcount()}
function xall(v){xcerts().forEach(function(c){if(v)xsel[c]=1;else delete xsel[c]});render()}
function xqin(el){xq=el.value;var p=el.selectionStart;render();var e=document.getElementById('xqin');e.focus();e.setSelectionRange(p,p)}
function vExport(){var cs=xcerts();
  return '<div class="card"><b>選擇證照匯出</b><div class="row" style="margin:8px 0"><input id="xqin" placeholder="搜尋證照名稱" value="'+esc(xq)+'" oninput="xqin(this)"><button class="btn" onclick="xall(true)">全選目前列出的</button><button class="btn" onclick="xall(false)">取消全選</button></div><div style="max-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:6px 10px">'+cs.map(function(c,i){return '<label style="display:block"><input type="checkbox" '+(xsel[c]?'checked':'')+' onchange="xtog('+i+',this.checked)"> '+esc(c)+'</label>'}).join('')+'</div><div class="row" style="margin-top:8px"><label class="mut"><input type="checkbox" '+(xleft?'checked':'')+' onchange="xleft=this.checked;xcount()"> 包含離職人員</label><button id="xbtn" class="btn p" onclick="exp(xrows(),\'證照名單.xlsx\')">匯出選取的證照（'+xrows().length+' 筆）</button></div></div>'}
var rfilt=false,rq='';
function isOn(u){return !!(u&&(u.on===undefined?(u.years||u.hours):u.on))}
function setOn(el){var c=certList()[+el.dataset.c],u=D.rules[c]||{};u.on=el.checked;D.rules[c]=u;save();render()}
function rqin(el){rq=el.value;var p=el.selectionStart;render();var e=document.getElementById('rqin');e.focus();e.setSelectionRange(p,p)}
var pre={},ei=-1;
function toTrain(i){var r=D.rows[i];pre={name:r.name,cert:std(r)};tab='train';render()}
function editRow(i){ei=i;tab='edit';render()}
function saveE(){var g=function(k){return document.getElementById('e_'+k).value.trim()},o={emp:g('emp'),name:g('name'),dept:g('dept'),cert:g('cert'),org:g('org'),iss:g('iss'),exp:g('exp'),no:g('no'),form:g('form'),loc:g('loc'),cx:g('cx')};
  if(!o.name||!o.cert){alert('姓名與證照名稱必填');return}
  if(ei<0)D.rows.push(o);else{var r=D.rows[ei];for(var k in o)r[k]=o[k]}
  save();tab='search';q=o.name;sel=null;render()}
function delE(){if(confirm('確定刪除這筆證照？')){D.rows.splice(ei,1);save();tab='search';render()}}
function vEdit(){
  var r=ei>=0?D.rows[ei]:{},n=ei<0,
  f=function(id,lb,v,t,ex){return '<div class="row" style="margin:6px 0"><span style="width:110px">'+lb+'</span><input id="e_'+id+'" type="'+(t||'text')+'" value="'+esc(v||'')+'" '+(ex||'')+'></div>'},
  nm=Array.from(new Set(D.rows.map(function(x){return x.name}))).sort(),
  cs=Array.from(new Set(D.rows.map(function(x){return x.cert}))).sort(),
  fo=['','紙本','電子檔','紙本＋電子檔','皆無'];
  if(r.form&&fo.indexOf(r.form)<0)fo.push(r.form);
  var op=function(a){return a.map(function(x){return '<option value="'+esc(x)+'">'}).join('')};
  return '<datalist id="en">'+op(nm)+'</datalist><datalist id="ec">'+op(cs)+'</datalist><div class="card"><b>'+(n?'新增證照':'編輯證照')+'</b><p class="mut">回訓後如果「換發新證」，直接改下面的生效日與有效期滿日；如果只是補時數、證沒有換，請到「回訓紀錄」新增，系統會自動延期。</p>'+
  f('emp','員編',r.emp)+f('name','姓名',r.name,'text','list="en"')+f('dept','部門',r.dept)+f('cert','證照名稱',r.cert,'text','list="ec"')+f('org','發照單位',r.org)+f('iss','生效日',r.iss,'date')+f('exp','有效期滿日',r.exp,'date')+f('no','證號',r.no)+
  '<div class="row" style="margin:6px 0"><span style="width:110px">資料形式</span><select id="e_form">'+fo.map(function(x){return '<option '+(x===(r.form||'')?'selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div>'+
  f('loc','紙本存放位置',r.loc,'text','placeholder="例如 A櫃第2格"')+f('cx','註銷日期',r.cx,'date')+
  '<div class="row" style="margin-top:10px"><button class="btn p" onclick="saveE()">儲存</button><button class="btn" onclick="go(\'search\')">取消</button>'+(n?'':'<button class="btn" onclick="delE()">刪除這筆</button>')+'</div></div>'}
function today(){var n=new Date();return iso(n.getFullYear(),n.getMonth()+1,n.getDate())}
function noFile(r){var f=r.form||'';return !f||/無|沒/.test(f)}
function missing(r){var m=[];if(r.cx||isLeft(r))return m;if(!r.exp)m.push('缺到期日');if(!r.no)m.push('缺證號');if(noFile(r))m.push('缺文件');
  var ru=D.rules[std(r)];if(isOn(ru)&&(ru.hours||ru.years)){var ts=D.train.filter(function(t){return t.name===r.name&&t.cert===std(r)}).sort(function(a,b){return b.date.localeCompare(a.date)});
  if(ts.length){if(ru.hours&&ts[0].hours<ru.hours)m.push('回訓時數不足');if(ts[0].proof==='無')m.push('缺結訓證明')}else if(ru.years&&days(r)!==null&&days(r)<0)m.push('應回訓未回訓')}
  return m}
function badge(r){if(isLeft(r))return '<span class="tag">離職</span>';if(r.cx)return '<span class="tag">已註銷</span>';var d=days(r);if(d===null)return '<span class="tag t-warn">無到期日</span>';
  if(d<0)return '<span class="tag t-bad">已過期 '+(-d)+' 天</span>';
  if(d<=D.days)return '<span class="tag t-warn">'+d+' 天後到期</span>';
  return '<span class="tag t-ok">有效</span>'}
function nav(){var t=[['search','查詢'],['people','人員名單'],['alert','提醒與缺漏'],['edit','新增證照'],['train','回訓紀錄'],['alias','名稱歸併'],['imp','匯入／匯出']];
  document.getElementById('nav').innerHTML=t.map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function go(t){tab=t;if(t==='edit')ei=-1;render()}
function render(){nav();var f={search:vSearch,people:vPeople,alert:vAlert,train:vTrain,edit:vEdit,alias:vAlias,imp:vImp}[tab];document.getElementById('v').innerHTML=banner()+f()}

function vSearch(){
  if(!D.rows.length)return '<div class="card">還沒有資料，請先到「匯入／匯出」匯入 Excel。</div>';
  var certs={};D.rows.forEach(function(r){if(!isLeft(r))certs[std(r)]=(certs[std(r)]||0)+1});
  var names=Object.keys(certs).sort();
  var kw=q.trim().toLowerCase();
  var hit=D.rows.filter(function(r){if(isLeft(r))return false;return sel?std(r)===sel:(kw&&(std(r)+r.cert+r.name+(r.emp||'')+(r.dept||'')).toLowerCase().indexOf(kw)>=0)});
  var h='<input class="big" id="q" placeholder="輸入證照名稱或人名，例如：堆高機" value="'+esc(q)+'" oninput="q=this.value;sel=null;keep()">';
  h+='<div style="margin:10px 0">'+names.filter(function(n){return !kw||n.toLowerCase().indexOf(kw)>=0}).slice(0,40).map(function(n){return '<button class="chip" onclick="pick(\''+esc(n).replace(/\'/g,"\\'")+'\')">'+esc(n)+' ('+certs[n]+')</button>'}).join('')+'</div>';
  if(sel||kw){lastHit=hit;
    h+='<div class="card"><div class="mut">'+(sel?'證照：<b>'+esc(sel)+'</b>，':'')+'共 '+hit.length+' 筆　<button class="btn" onclick="exp(lastHit,\'查詢結果.xlsx\')">匯出這份名單</button></div><div class="scroll"><table><tr><th>員編</th><th>姓名</th><th>部門</th><th>證照</th><th>發照單位</th><th>到期日</th><th>狀態</th><th>證號</th><th>文件</th><th>紙本位置</th><th></th></tr>'+
    hit.sort(function(a,b){return (due(a)||'9').localeCompare(due(b)||'9')}).map(function(r){return '<tr><td>'+esc(r.emp||'')+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.dept||'')+'</td><td>'+esc(std(r))+'</td><td>'+esc(r.org||'-')+'</td><td>'+esc(due(r)||'-')+'</td><td>'+badge(r)+'</td><td>'+esc(r.no||'-')+'</td><td>'+esc(r.form||'-')+'</td><td><input style="width:130px" placeholder="紙本在哪" value="'+esc(r.loc||'')+'" onchange="ed('+D.rows.indexOf(r)+',\'loc\',this.value)"></td><td><button class="btn" onclick="editRow('+D.rows.indexOf(r)+')">編輯</button></td></tr>'}).join('')+'</table></div></div>';
  }
  return h;
}
function keep(){var p=document.getElementById('q').selectionStart;render();var e=document.getElementById('q');e.focus();e.setSelectionRange(p,p)}
function pick(n){sel=n;q=n;render()}

function vAlert(){
  var ex=[],soon=[],miss=[],sz=0;
  D.rows.forEach(function(r){var d=days(r);if(d!==null&&d<0)ex.push(r);else if(d!==null&&d<=D.days)soon.push(r);if(missing(r).length){if(r.sn&&r.sn>today())sz++;else miss.push(r)}});
  function tb(a,fn){return a.length?'<div class="scroll"><table>'+a.map(fn).join('')+'</table></div>':'<div class="mut">沒有</div>'}
  var h='<div class="row"><span>提前提醒天數</span><select onchange="D.days=+this.value;save();render()">'+[30,45,60,90].map(function(n){return '<option '+(n===D.days?'selected':'')+'>'+n+'</option>'}).join('')+'</select></div>';
  h+='<div class="stat" style="margin:10px 0"><div class="t-bad">已過期<b>'+ex.length+'</b></div><div class="t-warn">快到期<b>'+soon.length+'</b></div><div class="t-warn">資料不齊<b>'+miss.length+'</b></div></div>';
  var row=function(r){return '<tr><td>'+esc(r.name)+(r.emp?' <span class="mut">'+esc(r.emp)+'</span>':'')+'</td><td>'+esc(std(r))+'</td><td>'+esc(due(r)||'-')+'</td><td>'+badge(r)+'</td><td><button class="btn" onclick="toTrain('+D.rows.indexOf(r)+')">補回訓</button> <button class="btn" onclick="editRow('+D.rows.indexOf(r)+')">改日期</button></td></tr>'};
  h+='<div class="card"><b>準備囉（'+D.days+' 天內到期）</b>'+tb(soon.sort(function(a,b){return due(a).localeCompare(due(b))}),row)+'</div>';
  h+='<div class="card"><b>已過期</b>'+tb(ex,row)+'</div>';
  h+='<div class="card"><b>資料不齊／待補件</b><span class="mut"> 直接在欄位補資料，補齊就會消失；也可按「一週後再提醒」暫時隱藏'+(sz?'（目前延後中 '+sz+' 筆）':'')+'</span>'+tb(miss,missRow)+'</div>';
  return h;
}

function vAlias(){
  var c={};D.rows.forEach(function(r){c[r.cert]=(c[r.cert]||0)+1});
  var raw=Object.keys(c).sort(),stds=Array.from(new Set(raw.map(function(n){return D.alias[n]||n})));
  if(!raw.length)return '<div class="card">尚無資料。</div>';
  return '<div class="card mut">同一張證照有不同寫法時，在右邊填同一個「標準名稱」，按 Enter 或點別處即可儲存，之後匯入會自動套用。</div>'+
  '<datalist id="sl">'+stds.map(function(s){return '<option value="'+esc(s)+'">'}).join('')+'</datalist>'+

function loginUI(msg){
  document.getElementById('nav').innerHTML='';document.getElementById('v').innerHTML='';
  document.getElementById('login').innerHTML='<div class="card login"><b>請登入</b><p class="mut">此系統含人員資料，僅限授權人員使用。</p><button class="btn p" onclick="gLogin()">使用 Google 登入</button><div class="mut" style="margin:12px 0">或使用帳號密碼</div><div class="row"><input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="密碼"><button class="btn" onclick="eLogin()">登入</button></div><div style="color:var(--bad);margin-top:8px">'+esc(msg||'')+'</div></div>'}
function gLogin(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){loginUI('登入失敗：'+e.message)})}
function eLogin(){auth.signInWithEmailAndPassword(document.getElementById('le').value.trim(),document.getElementById('lp').value).catch(function(){loginUI('登入失敗，請確認帳號與密碼')})}
function logout(){auth.signOut().then(function(){try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_bak')}catch(e){}location.reload()})}
function cloudSave(){clearTimeout(cloud.timer);setSync('同步中…');cloud.timer=setTimeout(pushCloud,800)}
function pushCloud(){
  var ref=db.doc('certapp/data');
  return db.runTransaction(function(tx){return tx.get(ref).then(function(sn){
    var v=sn.exists?(sn.data().ver||0):0;if(v!==cloud.ver)throw new Error('conflict');
    tx.set(ref,{json:JSON.stringify(D),ver:v+1,dev:DEV,by:user.email||user.uid,at:firebase.firestore.FieldValue.serverTimestamp()});return v+1})
  }).then(function(v){cloud.ver=v;setSync('已同步')}).catch(function(e){
    if(e.message==='conflict'){setSync('未同步');syncBar('別人剛更新了資料，你剛剛的修改還沒存到雲端。請先載入最新版，再重做一次修改。')}
    else setSync('同步失敗：'+e.message)})}
function reloadLatest(){db.doc('certapp/data').get().then(function(sn){
  D=JSON.parse(sn.data().json);cloud.ver=sn.data().ver||0;fixD();
  try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}syncBar('');setSync('已同步');render()})}
function loadCloud(){
  var ref=db.doc('certapp/data');
  return ref.get().then(function(sn){
    if(sn.exists){
      var loc=null;try{loc=localStorage.getItem(KEY)}catch(e){}
      if(loc&&D.rows&&D.rows.length&&loc!==sn.data().json){try{localStorage.setItem(KEY+'_bak',loc)}catch(e){}}
      D=JSON.parse(sn.data().json);cloud.ver=sn.data().ver||0;fixD();
      try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
    }else{cloud.ver=0;fixD();if(D.rows.length)pushCloud()}
    cloud.ready=true;
    ref.onSnapshot(function(x){if(!x.exists||x.metadata.hasPendingWrites)return;var d=x.data();
      if(d.dev!==DEV&&d.ver>cloud.ver)syncBar('有人更新了資料（'+esc(d.by||'')+'）。')});
  })}
load();fixD();
if(!(FB.apiKey&&FB.projectId&&typeof firebase!=='undefined')){render()}
else{
  firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();cloud.on=true;
  auth.onAuthStateChanged(function(u){
    if(u){user=u;document.getElementById('login').innerHTML='';acct();setSync('載入中…');
      loadCloud().then(function(){setSync('已同步');render()}).catch(function(e){
        document.getElementById('v').innerHTML='<div class="card">無法讀取雲端資料：'+esc(e.message)+'<p class="mut">若顯示權限不足，代表這個帳號不在允許名單內，請聯絡管理者。</p></div>'})
    }else{user=null;acct();loginUI('')}
  })
}

</script>
</body>
</html>
